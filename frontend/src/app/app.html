<div class="app-shell">
  @if (authService.isLoggedIn()) {
    <mat-toolbar color="primary" class="app-toolbar">
      <span class="brand" routerLink="/dashboard">
        <mat-icon>task_alt</mat-icon>
        Trackify
      </span>

      <nav class="nav-links">
        <a mat-button routerLink="/dashboard" routerLinkActive="active-link">
          <mat-icon>dashboard</mat-icon> Dashboard
        </a>
        <a mat-button routerLink="/tasks" routerLinkActive="active-link">
          <mat-icon>list</mat-icon> Tasks
        </a>
        @if (authService.isManager() || authService.isTeamLead()) {
          <a mat-button routerLink="/users" routerLinkActive="active-link">
            <mat-icon>group</mat-icon> Users
          </a>
        }
      </nav>

      <span class="spacer"></span>

      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="user-info" (click)="$event.stopPropagation()">
          <strong>{{ authService.currentUser()?.username }}</strong>
          <span class="role-badge role-{{ authService.currentUser()?.role }}">
            {{ authService.currentUser()?.role | titlecase }}
          </span>
        </div>
        <mat-divider />
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon> Logout
        </button>
      </mat-menu>
    </mat-toolbar>
  }

  <main class="main-content" [class.with-toolbar]="authService.isLoggedIn()">
    <router-outlet />
  </main>
</div>
